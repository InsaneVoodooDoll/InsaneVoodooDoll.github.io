<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSANE VOODOO DOLL - OFFICIAL MERCH</title>
    <style>
        @font-face {
            font-family: 'PunkKid';
            src: url('punk%20kid.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        :root {
            --bg-color: #0c0c0c;
            --text-color: #d8d8d8;
            --orange-neon: #ff4500;
            --yellow-neon: #ffcc00;
            --font-punk: 'PunkKid', 'Arial Black', 'Impact', sans-serif;
            --font-text: 'Courier New', Courier, monospace;
        }
        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(12, 12, 12, 0.85), rgba(12, 12, 12, 0.90)), url('sfondo-band.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            font-family: var(--font-text);
            line-height: 1.8;
            margin: 0;
            padding: 0;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; text-align: center; }
        
        h1 {
            font-family: var(--font-punk); font-size: 3.5rem; color: #fff; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 4px;
            text-shadow: 5px 5px 0px #000, -2px -2px 0px #000;
        }
        .merch-subtitle {
            font-family: var(--font-punk); color: var(--yellow-neon); font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 50px; text-shadow: 2px 2px 0px #000;
        }
        
        /* GRIGLIA PRODOTTI */
        .merch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin: 40px 0;
        }
        
        .merch-item {
            background: rgba(20, 20, 20, 0.6);
            border: 2px dashed rgba(255,255,255,0.2);
            padding: 20px;
            position: relative;
            transition: all 0.2s ease;
        }
        .merch-item:hover {
            border-color: var(--orange-neon);
            transform: scale(1.02);
            box-shadow: -5px 5px 0px var(--orange-neon);
        }
        
        .merch-thumb {
            width: 100%;
            height: 220px;
            object-fit: cover;
            filter: grayscale(100%) contrast(150%);
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        
        .item-title {
            font-family: var(--font-punk);
            font-size: 1.5rem;
            color: #fff;
            margin: 10px 0 5px 0;
            text-shadow: 2px 2px 0px #000;
        }
        
        .item-status {
            font-family: var(--font-punk);
            font-size: 1.1rem;
            color: var(--orange-neon);
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #000;
            margin-top: 10px;
        }
        
        .back-btn {
            display: inline-block; margin-top: 50px; color: #fff; text-decoration: none; font-family: var(--font-punk); font-size: 1.2rem; text-transform: uppercase; border-bottom: 1px dashed #fff; padding-bottom: 2px; text-shadow: 2px 2px 0px #000;
        }
        .back-btn:hover { color: var(--yellow-neon); border-color: var(--yellow-neon); }
                /* PULSANTE CROWDFUNDING DIGGERS FACTORY */
        .btn-diggers {
            display: inline-block;
            font-family: var(--font-punk);
            font-size: 1.1rem;
            background-color: var(--orange-neon);
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            border: 2px solid #fff;
            box-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
            transition: all 0.1s ease;
            margin-top: 15px;
            letter-spacing: 1px;
        }
        .btn-diggers:hover {
            background-color: var(--yellow-neon);
            color: #000;
            box-shadow: 0px 0px 0px transparent;
            transform: translate(4px, 4px);
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Official Merch</h1>
        <div class="merch-subtitle">Noise &amp; Gear // Coming Soon</div>
        <!-- GRIGLIA PRODOTTI IN ARRIVO -->
        <div class="merch-grid">
            
            <!-- ARTICOLO 1: T-SHIRT -->
            <div class="merch-item">
                <img src="copertina-album-insanity.jpeg" alt="I.V.D. Official T-Shirt" class="merch-thumb">
                <div class="item-title">Official T-Shirt</div>
                <p style="font-size: 0.95rem; color: #aaa; margin: 0;">Hardcore Noise Florence Style</p>
                <div class="item-status">⚡ COMING SOON ⚡</div>
            </div>

            <!-- ARTICOLO 2: VINILE / CD -->
            <div class="merch-item">
                <img src="copertina-album-insanity.jpeg" alt="We Are All Insanity Physical Album" class="merch-thumb">
                <div class="item-title">We Are All Insanity</div>
                <p style="font-size: 0.95rem; color: #aaa; margin: 0;">Physical Copy / Limited Edition</p>
                <div class="item-status">⚡ COMING SOON ⚡</div>
            </div>

            <!-- ARTICOLO 3: ACCESSORI -->
            <div class="merch-item">
                <img src="copertina-album-insanity.jpeg" alt="I.V.D. Limited Patch" class="merch-thumb">
                <div class="item-title">Official Patch</div>
                <p style="font-size: 0.95rem; color: #aaa; margin: 0;">Embroidered Voodoo Doll Logo</p>
                <div class="item-status">⚡ COMING SOON ⚡</div>
            </div>

        </div>
        
        <!-- PULSANTE PER TORNARE ALLA HOME -->
        <a href="index.html" class="back-btn">Go Back to Home</a>
    </div>
</body>
</html>
